      const en = h('div', 'ru', esc(w.en) + ' '); en.append(spk(w.id)); bk.append(en); bk.insertAdjacentHTML('beforeend', exs);
    }
    inn.append(fr, bk); fc.append(inn); let heard = false;
    fc.onclick = () => { fc.classList.toggle('flip'); if (CD === 'ru' && !heard) { heard = true; say('audio/w_' + w.id + '.mp3'); } };
    const r = h('div', 'row'), y = h('button', 'btn', 'Знаю'), n = h('button', '', 'Ещё повторю');
    y.onclick = () => { known++; i++; show(); };
    n.onclick = () => { deck.push(w); i++; show(); };
    r.append(n, y); box.append(fc, r); if (CD === 'en') say('audio/w_' + w.id + '.mp3');
  }
  show();
}
/* 2 match */
function match(L) {
  const set = pick(L, Math.min(6, L.length)); let done = 0, errs = 0, sel = null; const me = RUN;
  const S = head('Пары', 'Нажми на слово, потом на его перевод.', '0 / ' + set.length);
  const g = h('div', 'mgrid'), a = h('div', 'mcol'), b = h('div', 'mcol'); g.append(a, b); S.append(g);
  shuf(set).forEach(w => { const x = h('button', '', '<img src="' + img(w.id) + '" alt=""><span>' + esc(w.en) + '</span>'); x.dataset.id = w.id; x.onclick = () => { if (x.classList.contains('done')) return; a.querySelectorAll('.sel').forEach(e => e.classList.remove('sel')); x.classList.add('sel'); sel = x; say('audio/w_' + w.id + '.mp3'); }; a.append(x); });
  shuf(set).forEach(w => { const y = h('button', '', '<span>' + esc(w.ru) + '</span>'); y.onclick = () => {
    if (!sel || y.classList.contains('done')) return;
    if (sel.dataset.id === w.id) { sel.classList.remove('sel'); sel.classList.add('done'); y.classList.add('done'); hit(w.id); stat(true); sel = null; done++; $('.cnt', S).textContent = done + ' / ' + set.length;
      if (done === set.length) setTimeout(() => me === RUN && finish(S, set.length - Math.min(errs, set.length), set.length, () => match(L)), 600); }
    else { errs++; miss(sel.dataset.id); stat(false); [sel, y].forEach(e => { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }); }
  }; b.append(y); });
}
/* generic one-by-one quiz */
function quiz(title, sub, items, render) {
  let i = 0, ok = 0; const me = RUN; const S = head(title, sub); const box = h('div', 'qbox'); S.append(box);
  const next = () => { if (me !== RUN) return; if (i >= items.length) { finish(S, ok, items.length, () => run()); return; } $('h2', S).innerHTML = '<span class="cnt">' + (i + 1) + ' / ' + items.length + '</span>' + title; box.innerHTML = ''; render(box, items[i], good => { if (good) ok++; i++; const nb = h('button', 'btn nxt', 'Дальше →'); nb.onclick = next; const r = h('div', 'row'); r.append(nb); box.append(r); setTimeout(() => { nb.focus({preventScroll: true}); }, 30); }); };
  next();
}
function options(box, right, pool, label, onDone, id) {
  const wrong = shuf(pool.filter(w => w.id !== right.id && !(right.g && w.g === right.g))).slice(0, 3);
  const o = h('div', 'opts'); let locked = false;
  shuf([right, ...wrong]).forEach(w => { const b = h('button', '', esc(label(w))); b.onclick = () => {
    if (locked) return; locked = true;
    if (w.id === right.id) { b.classList.add('right'); hit(id); stat(true); onDone(true); }
    else { b.classList.add('wrong'); [...o.children].find(x => x.textContent === label(right)).classList.add('right'); miss(id); stat(false); onDone(false); }
  }; o.append(b); });
  box.append(o);
}
const poolFor = L => L.length >= 4 ? L : DATA.words;
/* 3 choose */
function choose(L) {
  const items = pick(L, Math.min(10, L.length)).map((w, i) => ({w, dir: i % 2}));
  quiz('Перевод', 'Выбери правильный вариант.', items, (box, {w, dir}, done) => {
    const hd = h('div', 'qhead', '<img src="' + img(w.id) + '" alt="">'); const t = h('div', 't', dir ? esc(w.ru) + '<small>как это по-английски?</small>' : esc(w.en) + '<small>что это значит?</small>');
    hd.append(t); if (!dir) { hd.append(spk(w.id)); say('audio/w_' + w.id + '.mp3'); } box.append(hd);
    options(box, w, poolFor(L), x => dir ? x.en : x.ru, good => { if (dir) say('audio/w_' + w.id + '.mp3'); done(good); }, w.id);
  });
}
/* typed answer helper */
function typed(box, answers, id, onDone, after) {
  if (W[id] && W[id].g) answers = answers.concat(syn(id).map(x => x.en));  // synonyms count too
  const fb = h('div', 'fb'); const inp = box.querySelector('.sent input') || (() => { const x = h('input', 'tin'); x.placeholder = 'напиши по-английски'; box.append(x); return x; })();
  inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('autocapitalize', 'off');
  const r = h('div', 'row'), hint = h('button', '', 'Подсказка'), go = h('button', 'btn', 'Проверить'); r.append(hint, go); box.append(r, fb);
  let hints = 0, locked = false;
  hint.onclick = () => { hints++; const a = answers[0]; inp.value = a.slice(0, Math.min(a.length - 1, hints * 2 - 1)); inp.focus(); };
  const check = () => {
    if (locked || !inp.value.trim()) return; locked = true; go.disabled = hint.disabled = true; inp.readOnly = true;
    const v = inp.value, base = W[id] ? W[id].en : '';
    let good = answers.some(a => norm(a) === norm(v) || core(a) === core(v)), close = false;
    if (!good && base && core(base) === core(v)) { good = true; close = true; }
    fb.className = 'fb ' + (close ? 'warn' : good ? 'ok' : 'bad');
    fb.innerHTML = close ? 'Почти! Слово верное, но здесь нужна форма: <b>' + esc(answers[0]) + '</b>' : good ? 'Верно!' : 'Правильно: <b>' + esc(answers[0]) + '</b>';
    inp.style.borderColor = close ? 'var(--warn)' : good ? 'var(--ok)' : 'var(--bad)'; good && !hints ? hit(id) : !good && miss(id); stat(good);
    if (after) after(good); onDone(good);
  };
  go.onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (locked) { const n = box.querySelector('.nxt'); if (n) n.click(); } else check(); } }; setTimeout(() => inp.focus({preventScroll: true}), 50);
}
/* 4 write */
function write(L) {
  quiz('Напиши', 'Напиши слово по-английски. Подсказка открывает первые буквы.', pick(L, Math.min(10, L.length)), (box, w, done) => {
    box.append(h('div', 'qhead', '<img src="' + img(w.id) + '" alt=""><div class="t">' + esc(w.ru) + '<small>как это по-английски?</small></div>'));
    typed(box, [w.en], w.id, done, () => { say('audio/w_' + w.id + '.mp3'); box.querySelector('.qhead').append(spk(w.id)); });
  });
}
/* 5 sentences */
function sentBox(box, e, w, ru) {
  const s = h('div', 'sent'); const [a, b] = e.t.split('___'); s.append(document.createTextNode(a)); const inp = h('input'); inp.style.width = Math.max(8, e.a[0].length + 2) + 'ch'; s.append(inp);
  if (ru) s.append(h('span', 'tr', ' (' + esc(w.ru) + ')'));
  s.append(document.createTextNode(b)); box.append(s); return inp;
}
function sent(L) {
  const items = pick(L, Math.min(10, L.length)).map(w => { const k = Math.random() * w.ex.length | 0; return {w, e: w.ex[k], k}; });
  quiz('Предложения', 'Впиши слово, которое подходит по смыслу. После ответа предложение прозвучит целиком.', items, (box, {w, e, k}, done) => {
    const src = 'audio/s_' + w.id + (k ? '_' + k : '') + '.mp3';
    sentBox(box, e, w, true); typed(box, e.a, w.id, done, () => { say(src); const b = h('button', 'spk', SPK); b.title = 'Послушать ещё раз'; b.onclick = () => say(src); box.querySelector('.sent').append(' ', b); });
  });
}
/* 6 situations */
function situ(L) {
  const ids = new Set(L.map(w => w.id)); const items = shuf(DATA.situations.filter(s => ids.has(s.a))).slice(0, 10);
  if (!items.length) { head('Ситуации', 'Для этих слов ситуаций пока нет.'); return; }
  quiz('Ситуации', 'Прочитай ситуацию и выбери слово, которое подходит.', items, (box, s, done) => {
    box.append(h('div', 'situ', esc(s.t)));
    options(box, W[s.a], poolFor(L), x => x.en, good => { say('audio/w_' + s.a + '.mp3'); done(good); }, s.a);
  });
}
/* 7 texts: drag & drop + click */
function text(L) {
  const ms = new Set(L.map(w => w.set)); const TT = DATA.texts.filter(t => ms.has(t.set));
  const S = head('Текст', 'Перетащи слова в пропуски. Можно и кликом: сначала слово, потом пропуск.');
  if (!TT.length) { S.append(h('p', 'empty', 'Для этих слов текста пока нет.')); return; }
  if (TT.length > 1) { const c = h('div', 'chips'); TT.forEach((t, i) => { const b = h('button', i ? '' : 'on', esc(t.title)); b.onclick = () => { c.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); one(t); }; c.append(b); }); S.append(c); }
  const box = h('div'); S.append(box);
  function one(t) {
    box.innerHTML = ''; if (cur) cur.pause();
    box.append(h('h2', '', esc(t.title)), h('p', 'sub', esc(t.sub || '')));
    const bank = h('div', 'bank'), tx = h('div', 'text'); let sel = null, left = 0, errs = 0;
    const parts = t.t.split(/\[([^\]]+)\]/); const answers = [];
    parts.forEach((p, i) => { if (i % 2 === 0) tx.append(document.createTextNode(p)); else {
      left++; answers.push(p); const sl = h('span', 'slot', '&nbsp;'); sl.dataset.a = p;
      const put = word => { if (sl.classList.contains('ok')) return;
        const wp = byEn(p), wd = byEn(word.dataset.w);
        if (norm(word.dataset.w) === norm(p) || (wp && wd && wp.g && wp.g === wd.g)) { sl.className = 'slot ok'; sl.textContent = word.dataset.w; word.remove(); sel = null; tx.querySelectorAll('.armed').forEach(x => x.classList.remove('armed')); left--; const w = DATA.words.find(x => norm(x.en) === norm(p)); if (w) hit(w.id); stat(true); if (!left) done(); }
        else { errs++; sl.classList.add('bad'); setTimeout(() => sl.classList.remove('bad'), 600); const w = DATA.words.find(x => norm(x.en) === norm(p)); if (w) miss(w.id); stat(false); } };
      sl.onclick = () => { if (sel) put(sel); };
      sl.ondragover = e => { e.preventDefault(); sl.classList.add('over'); }; sl.ondragleave = () => sl.classList.remove('over');
      sl.ondrop = e => { e.preventDefault(); sl.classList.remove('over'); const w = bank.querySelector('[data-w="' + CSS.escape(e.dataTransfer.getData('text')) + '"]'); if (w) put(w); };
      tx.append(sl); } });
    shuf(answers).forEach(a => { const b = h('button', '', esc(a.charAt(0).toLowerCase() + a.slice(1))); b.dataset.w = a; b.draggable = true;
      b.ondragstart = e => e.dataTransfer.setData('text', a);
      b.onclick = () => { bank.querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; tx.querySelectorAll('.slot:not(.ok)').forEach(x => x.classList.add('armed')); };
      bank.append(b); });
    const fb = h('div', 'fb');
    function done() { fb.className = 'fb ok'; fb.textContent = 'Готово! Ошибок: ' + errs + '. Теперь послушай историю целиком.'; bank.remove(); }
    box.append(bank, tx, fb, h('p', 'sub', 'Послушай историю:'), player(t.au));
  }
  one(TT[0]);
}
/* 8 listen */
function listen(L) {
  quiz('Слушай', 'Послушай предложение и впиши слово, которое пропущено.', pick(L, Math.min(10, L.length)), (box, w, done) => {
    const p = player('audio/s_' + w.id + '.mp3'); box.append(p); const e = w.ex[0];
